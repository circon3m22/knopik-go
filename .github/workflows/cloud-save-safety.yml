name: KNOPIK GO cloud save safety checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Save integrity, migration, access and shared engine tests
        run: node --test tests/save-synchronization.test.mjs tests/cloud-session-policy.test.mjs tests/go-access.test.mjs tests/game-logic.test.mjs
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build GitHub Pages version
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /knopik-go
          NEXT_PUBLIC_SITE_URL: https://circon3m22.github.io/knopik-go
