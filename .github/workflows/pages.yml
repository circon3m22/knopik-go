name: Deploy Knopik GO to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knopik-go-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_BASE_PATH: /knopik-go
      NEXT_PUBLIC_SITE_URL: https://circon3m22.github.io/knopik-go
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Check apartment geometry and offline updates
        run: node --test tests/apartment-world.test.mjs tests/offline-pack.test.mjs tests/offline-worker.test.mjs tests/render-preferences.test.mjs tests/dungeon-ingredients.test.mjs tests/game-update.test.mjs tests/ultra-art.test.mjs tests/joystick-release.test.mjs tests/world-reset-ui.test.mjs tests/bar-bottle-anchor.test.mjs tests/compact-game-hud.test.mjs tests/apartment-nav-fps.test.mjs tests/apartment-computer.test.mjs tests/opening-cinema-layout.test.mjs tests/case-cinematic.test.mjs tests/aura-economy.test.mjs tests/arcade-dungeon.test.mjs tests/aura-machine.test.mjs tests/settings-navigation.test.mjs tests/currency-coins.test.mjs tests/apartment-destinations.test.mjs tests/pause-settings.test.mjs tests/first-homecoming.test.mjs tests/game-install.test.mjs tests/cinematic-controls.test.mjs tests/adventure-training.test.mjs tests/adventure-flow.test.mjs
      - name: Check two-player co-op
        run: node --test tests/coop-engine.test.mjs tests/coop-session.test.mjs tests/coop-renderer.test.mjs
      - name: Build static game
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
